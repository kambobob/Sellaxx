name: ChestSell
version: 1.0.0
main: com.example.chestsell.ChestSellPlugin
api-version: "1.21"
folia-supported: true
depend: [Vault, EconomyShopGUI]
commands:
  sellaxe:
    description: Get the sell axe
    usage: /sellaxe
    permission: chestsell.axe
permissions:
  chestsell.use:
    description: Use right-click chest selling
    default: true
  chestsell.axe:
    description: Use the /sellaxe command and sell axe
    default: op
